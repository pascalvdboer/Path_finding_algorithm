services:
  brain:
    build: .
    container_name: agent-brain
    ports:
      - "8000:8000"          # dashboard + API — open http://<host>:8000
    volumes:
      - brain-data:/data     # the brain's memory (brain.db) persists here
    environment:
      # Protect a public/tunnel deployment: set a secret and every request
      # (and the dashboard, via ?token=...) must present it.
      - BRAIN_TOKEN=${BRAIN_TOKEN:-}
      # What the team is expert in. seo (default) | stockmarket | your own pack.
      - BRAIN_DOMAIN=${BRAIN_DOMAIN:-seo}
    restart: unless-stopped  # always-on: comes back after reboots

  # The Feeder / Professor — always-on too, so the brain keeps teaching itself.
  feeder:
    build: .
    container_name: agent-brain-feeder
    depends_on:
      - brain
    environment:
      - BRAIN_URL=http://brain:8000
      - BRAIN_TOKEN=${BRAIN_TOKEN:-}
      - BRAIN_DOMAIN=${BRAIN_DOMAIN:-seo}
      # Let the Feeder source new knowledge from reliable/primary sources.
      # Point BRAIN_SEARCH_URL at your search bridge and list the sources it
      # should trust (manuals, official docs, courses, standards):
      - BRAIN_SEARCH_URL=${BRAIN_SEARCH_URL:-}
      - BRAIN_TRUSTED_SOURCES=${BRAIN_TRUSTED_SOURCES:-}
    command: sh -c "sleep 5 && python agents/roster.py && python agents/feeder.py"
    restart: unless-stopped

volumes:
  brain-data:
