name: Assistent
options:
  bundleIdPrefix: com.jouwnaam
  developmentLanguage: nl
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # vul hier je Apple Team ID in (of kies het in Xcode)
    CODE_SIGN_STYLE: Automatic
targets:
  Assistent:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - Assistent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jouwnaam.assistent
        PRODUCT_NAME: Assistent
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Assistent/Info.plist
      properties:
        CFBundleDisplayName: Assistent
        CFBundleDevelopmentRegion: nl
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "De assistent luistert naar je stem zodat je kunt praten in plaats van typen."
        NSSpeechRecognitionUsageDescription: "Je spraak wordt omgezet naar tekst zodat de assistent je begrijpt."
        NSCalendarsFullAccessUsageDescription: "De assistent leest en maakt afspraken in je agenda."
        NSRemindersFullAccessUsageDescription: "De assistent leest en maakt herinneringen voor je."
        NSContactsUsageDescription: "De assistent zoekt contacten op zodat hij mensen kan bellen, appen en mailen."
        NSLocationWhenInUseUsageDescription: "De assistent gebruikt je locatie voor routes, weer en dingen in de buurt."
